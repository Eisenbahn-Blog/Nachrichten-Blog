name: Bilder optimieren

on:
  push:
    branches:
      - main
    paths:
      - "assets/uploads/**"
      - ".github/workflows/optimize-images.yml"
    paths-ignore:
      - "assets/uploads/optimized/**"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ImageMagick installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Fehlende WebP-Versionen erzeugen
        shell: bash
        run: |
          set -e

          mkdir -p assets/uploads/optimized

          find assets/uploads -maxdepth 1 -type f \( \
            -iname "*.jpg" \
            -o -iname "*.jpeg" \
            -o -iname "*.png" \
          \) -print0 |
          while IFS= read -r -d '' file; do

            filename="$(basename "$file")"
            name="${filename%.*}"
            output="assets/uploads/optimized/${name}.webp"

            if [ -f "$output" ]; then
              echo "Bereits vorhanden: $output"
              continue
            fi

            echo "Optimiere: $file"
            echo "       -> $output"

            magick "$file" \
              -resize "1600x1600>" \
              -strip \
              -quality 82 \
              "$output"

          done

      - name: Optimierte Bilder prüfen
        shell: bash
        run: |
          echo "===== Optimierte Bilder ====="

          find assets/uploads/optimized \
            -maxdepth 1 \
            -type f \
            -iname "*.webp" \
            -printf "%f\n" |
            sort

      - name: Optimierte Bilder committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/uploads/optimized/

          if git diff --cached --quiet; then
            echo "Keine neuen optimierten Bilder."
            exit 0
          fi

          git commit -m "Bilder automatisch optimieren"
          git push
