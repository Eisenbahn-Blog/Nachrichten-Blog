title: Eisenbahn-Blog
description: Nachrichten rund um Eisenbahn und ÖPNV in Deutschland.
url: "https://eisenbahn-blog.github.io"
baseurl: "/Nachrichten-Blog"
lang: de
timezone: Europe/Berlin
markdown: kramdown
permalink: /artikel/:year/:month/:day/:title/
collections:
  authors:
    output: false
  categories:
    output: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      breaking: false
      categories: []
      author: "Leonard Klinger"
      image: ""
      caption: ""
      credit: ""
      alt: ""
      gallery: []

exclude:
  - .git/
  - .github/
  - .bundle/
  - vendor/
  - src/
  - node_modules/
  - package.json
  - package-lock.json
  - yarn.lock
  - wrangler.toml
  - wrangler.jsonc
  - Gemfile
  - Gemfile.lock
  - "*.backup"
  - "*.backup-*"
  - "*.v2-backup"
  - "*.swp"
