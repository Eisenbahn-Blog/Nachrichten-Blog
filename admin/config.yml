backend:
  name: github
  repo: leonard566/Nachrichten-Blog
  branch: main
  base_url: "https://nachrichten-blog.leonardklinger9.workers.dev" 

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/Nachrichten-Blog/assets/uploads"

site_url: "https://leonard566.github.io/Nachrichten-Blog"

collections:
  - name: "posts"
    label: "Beiträge"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Titel"
        name: "title"
        widget: "string"

      - label: "Veröffentlichungsdatum"
        name: "date"
        widget: "datetime"

      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]

      - label: "Kategorie"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]

      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false

      - label: "Bildunterschrift"
        name: "image_caption"
        widget: "string"
        required: false

      - label: "Eilmeldung"
        name: "breaking_news"
        widget: "boolean"
        default: false

      - label: "Inhalt"
        name: "body"
        widget: "markdown"

  - name: "authors"
    label: "Autoren"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Name"
        name: "name"
        widget: "string"

      - label: "Beschreibung"
        name: "description"
        widget: "text"
        required: false

      - label: "Profilbild"
        name: "image"
        widget: "image"
        required: false

  - name: "categories"
    label: "Kategorien"
    folder: "_categories"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Name"
        name: "title"
        widget: "string"

      - label: "Beschreibung"
        name: "description"
        widget: "text"
        required: false
