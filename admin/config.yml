locale: "de"

backend:
  name: github
  repo: Eisenbahn-Blog/Nachrichten-Blog
  branch: main
  base_url: "https://nachrichten-blog.train-news.workers.dev"

publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://leonard566.github.io/Nachrichten-Blog"

collections:

  - name: "posts"
    label: "Beiträge"
    label_singular: "Beitrag"
    folder: "_posts"
    create: true

    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    preview_path: "Nachrichten-Blog/{{year}}/{{month}}/{{day}}/{{slug}}/"

    summary: "{{title}} – {{author}}"

    sortable_fields:
      - field: "date"
        label: "Datum"
        direction: "Descending"
      - field: "title"
        label: "Titel"
      - field: "author"
        label: "Autor"

    fields:

      - label: "Titel"
        name: "title"
        widget: "string"
        hint: "Überschrift des Beitrags"

      - label: "Veröffentlichungsdatum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"

      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields:
          - "name"
        value_field: "name"
        display_fields:
          - "name"

      - label: "Themen"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields:
          - "name"
        value_field: "name"
        display_fields:
          - "name"
        multiple: true

      - label: "Bundesland / Region"
        name: "region"
        widget: "select"
        required: false
        options:
          - "Deutschlandweit"
          - "Baden-Württemberg"
          - "Bayern"
          - "Berlin"
          - "Brandenburg"
          - "Bremen"
          - "Hamburg"
          - "Hessen"
          - "Mecklenburg-Vorpommern"
          - "Niedersachsen"
          - "Nordrhein-Westfalen"
          - "Rheinland-Pfalz"
          - "Saarland"
          - "Sachsen"
          - "Sachsen-Anhalt"
          - "Schleswig-Holstein"
          - "Thüringen"
          - "Österreich"
          - "Schweiz"
          - "International"

      - label: "Eilmeldung"
        name: "breaking"
        widget: "boolean"
        default: false
        required: false
        hint: "Nur für wichtige und zeitkritische Nachrichten verwenden."

      - label: "Titelbild"
        name: "image"
        widget: "image"
        required: false

      - label: "Bildunterschrift"
        name: "caption"
        widget: "string"
        required: false

      - label: "Bildnachweis"
        name: "credit"
        widget: "string"
        required: false

      - label: "Alternativtext"
        name: "alt"
        widget: "string"
        required: false
        hint: "Beschreibung des Bildes für Barrierefreiheit."

      - label: "Kurzbeschreibung"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "Kurze Zusammenfassung für Übersichten und Vorschauen."

      - label: "Bildergalerie"
        name: "gallery"
        widget: "list"
        required: false

        fields:

          - label: "Bild"
            name: "image"
            widget: "image"

          - label: "Bildunterschrift"
            name: "caption"
            widget: "string"
            required: false

          - label: "Bildnachweis"
            name: "credit"
            widget: "string"
            required: false

          - label: "Alternativtext"
            name: "alt"
            widget: "string"
            required: false

      - label: "Inhalt"
        name: "body"
        widget: "markdown"

  - name: "authors"
    label: "Autoren"
    label_singular: "Autor"
    folder: "_authors"
    create: true

    slug: "{{slug}}"

    summary: "{{name}}"

    fields:

      - label: "Name"
        name: "name"
        widget: "string"

      - label: "Beschreibung"
        name: "description"
        widget: "text"
        required: false

      - label: "Profilbild"
        name: "image"
        widget: "image"
        required: false

  - name: "categories"
    label: "Kategorien"
    label_singular: "Kategorie"
    folder: "_categories"
    create: true

    slug: "{{slug}}"

    summary: "{{name}}"

    fields:

      - label: "Name"
        name: "name"
        widget: "string"

      - label: "Beschreibung"
        name: "description"
        widget: "text"
        required: false

      - label: "Symbol"
        name: "icon"
        widget: "string"
        required: false
        hint: "Optionales Symbol oder Emoji für die Kategorie."
