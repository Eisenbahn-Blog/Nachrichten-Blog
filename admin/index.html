<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Redaktion · Eisenbahn-Blog</title>

  <meta name="theme-color" content="#d71920">

  <style>
    :root {
      --accent: #d71920;
      --dark: #11181f;
      --text: #18212b;
      --muted: #697582;
      --background: #f5f7f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--background);
    }

    #cms-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top right,
          rgba(215, 25, 32, .12),
          transparent 40%
        ),
        var(--background);
      transition: opacity .35s ease, visibility .35s ease;
    }

    #cms-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(420px, calc(100% - 32px));
      padding: 34px;
      text-align: center;
      background: white;
      border: 1px solid #e2e7eb;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(20, 30, 40, .12);
    }

    .loading-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--accent);
      color: white;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(215, 25, 32, .25);
    }

    .loading-card h1 {
      margin: 0;
      color: var(--text);
      font-size: 25px;
      letter-spacing: -.03em;
    }

    .loading-card p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .loading-bar {
      width: 100%;
      height: 4px;
      margin-top: 25px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf0f2;
    }

    .loading-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      animation: loading 1.1s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(350%);
      }
    }
  </style>
</head>

<body>

  <div id="cms-loading">
    <div class="loading-card">
      <div class="loading-logo">🚆</div>

      <h1>Eisenbahn-Blog</h1>
      <p>Redaktionsbereich · Deutschland</p>

      <div class="loading-bar"></div>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        const loading = document.getElementById("cms-loading");

        if (loading) {
          loading.classList.add("hidden");
        }
      }, 700);
    });
  </script>

  <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>

</body>
</html>
