<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Eisenbahn-Blog Redaktion</title>

  <style>
    /*
     * ============================================================
     * Eisenbahn-Blog – Decap CMS Design
     * ============================================================
     */

    :root {
      --blog-red: #d71920;
      --blog-red-dark: #b51218;
      --blog-dark: #18212b;
      --blog-gray: #697582;
      --blog-border: #e1e6ea;
      --blog-bg: #f5f7f9;
      --blog-white: #ffffff;
      --blog-shadow: 0 8px 30px rgba(20, 30, 40, 0.08);
    }

    /*
     * ------------------------------------------------------------
     * Grundgestaltung
     * ------------------------------------------------------------
     */

    body {
      background: var(--blog-bg) !important;
    }

    /*
     * GitHub-Link im CMS ausblenden.
     */

    a[href*="github.com"] {
      display: none !important;
    }

    button[aria-label*="GitHub"],
    button[aria-label*="github"],
    button[title*="GitHub"],
    button[title*="github"] {
      display: none !important;
    }

    /*
     * ------------------------------------------------------------
     * Decap Header
     * ------------------------------------------------------------
     */

    header {
      border-bottom: 1px solid var(--blog-border) !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
    }

    /*
     * ------------------------------------------------------------
     * Buttons
     * ------------------------------------------------------------
     */

    button {
      border-radius: 9px !important;
    }

    /*
     * Primäre Aktionen
     */

    button[type="submit"],
    [class*="PublishButton"],
    [class*="publishButton"] {
      border-radius: 9px !important;
      font-weight: 700 !important;
    }

    /*
     * ------------------------------------------------------------
     * Karten und Panels
     * ------------------------------------------------------------
     */

    [class*="Card"],
    [class*="card"],
    [class*="Panel"],
    [class*="panel"] {
      border-radius: 12px !important;
    }

    /*
     * ------------------------------------------------------------
     * Eingabefelder
     * ------------------------------------------------------------
     */

    input,
    textarea,
    select {
      border-radius: 8px !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--blog-red) !important;
      box-shadow: 0 0 0 2px rgba(215, 25, 32, 0.12) !important;
      outline: none !important;
    }

    /*
     * ------------------------------------------------------------
     * Links
     * ------------------------------------------------------------
     */

    a {
      color: inherit;
    }

    /*
     * ------------------------------------------------------------
     * Mobile
     * ------------------------------------------------------------
     */

    @media (max-width: 700px) {
      body {
        font-size: 15px;
      }

      button {
        min-height: 42px;
      }

      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }
  </style>
</head>

<body>

  <script>
    /*
     * ============================================================
     * Eisenbahn-Blog CMS Erweiterungen
     * ============================================================
     */

    /*
     * GitHub-Links entfernen.
     *
     * Decap erzeugt seine Oberfläche dynamisch.
     * Deshalb wird regelmäßig geprüft, ob ein entsprechender
     * Link hinzugekommen ist.
     */

    function removeGitHubLinks() {
      document
        .querySelectorAll('a[href*="github.com"]')
        .forEach(function (element) {
          element.remove();
        });

      document
        .querySelectorAll('button')
        .forEach(function (button) {
          const text =
            (button.textContent || '').toLowerCase();

          const aria =
            (button.getAttribute('aria-label') || '').toLowerCase();

          const title =
            (button.getAttribute('title') || '').toLowerCase();

          if (
            text.includes('github') ||
            aria.includes('github') ||
            title.includes('github')
          ) {
            button.remove();
          }
        });
    }


    /*
     * ------------------------------------------------------------
     * "Blog nutzen" optisch verbessern
     * ------------------------------------------------------------
     *
     * Wir suchen nach Elementen mit entsprechendem Text.
     */

    function styleBlogUseArea() {
      document
        .querySelectorAll('*')
        .forEach(function (element) {

          const text =
            (element.textContent || '').trim();

          if (
            text === 'Blog nutzen' ||
            text === 'Blog nutzen →'
          ) {
            element.style.fontWeight = '800';
            element.style.borderRadius = '10px';
          }
        });
    }


    /*
     * ------------------------------------------------------------
     * "Änderungen" optisch verbessern
     * ------------------------------------------------------------
     */

    function styleChangesArea() {
      document
        .querySelectorAll('*')
        .forEach(function (element) {

          const text =
            (element.textContent || '').trim();

          if (text === 'Änderungen') {
            element.style.fontWeight = '800';
          }
        });
    }


    /*
     * ------------------------------------------------------------
     * Gesamte Oberfläche aktualisieren
     * ------------------------------------------------------------
     */

    function improveCMS() {
      removeGitHubLinks();
      styleBlogUseArea();
      styleChangesArea();
    }


    /*
     * Decap CMS wird dynamisch aufgebaut.
     *
     * MutationObserver sorgt dafür, dass unsere Anpassungen
     * auch nach Navigation innerhalb des CMS bestehen bleiben.
     */

    const observer = new MutationObserver(function () {
      improveCMS();
    });

    observer.observe(
      document.documentElement,
      {
        childList: true,
        subtree: true
      }
    );


    /*
     * Erster Durchlauf
     */

    improveCMS();
  </script>


  <!--
    ============================================================
    Decap CMS
    ============================================================
  -->

  <script
    src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js">
  </script>

</body>
</html>
