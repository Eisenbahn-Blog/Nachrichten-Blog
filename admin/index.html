<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Eisenbahn-Blog Redaktion</title>

  <style>
    /*
     * GitHub-Link im Decap-CMS ausblenden.
     *
     * Decap kann seine Header-Struktur je nach Version verändern.
     * Deshalb verwenden wir mehrere Selektoren.
     */

    a[href*="github.com"] {
      display: none !important;
    }

    /*
     * Falls Decap den Link über einen Button rendert.
     */
    button[aria-label*="GitHub"],
    button[title*="GitHub"] {
      display: none !important;
    }
  </style>
</head>

<body>

  <script>
    /*
     * GitHub-Links entfernen, sobald Decap-CMS
     * seine Oberfläche geladen hat.
     */
    function removeGitHubLinks() {
      document
        .querySelectorAll('a[href*="github.com"]')
        .forEach(function (element) {
          element.remove();
        });

      document
        .querySelectorAll('button')
        .forEach(function (button) {
          const text =
            (button.textContent || '').toLowerCase();

          const label =
            (button.getAttribute('aria-label') || '').toLowerCase();

          const title =
            (button.getAttribute('title') || '').toLowerCase();

          if (
            text.includes('github') ||
            label.includes('github') ||
            title.includes('github')
          ) {
            button.remove();
          }
        });
    }

    /*
     * Decap wird dynamisch geladen.
     * Deshalb beobachten wir Änderungen am DOM.
     */
    const observer = new MutationObserver(function () {
      removeGitHubLinks();
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });

    /*
     * Sofortiger erster Durchlauf.
     */
    removeGitHubLinks();
  </script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

</body>
</html>
